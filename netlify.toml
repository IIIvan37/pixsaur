[build]
  command = "pnpm build"
  publish = "dist"
  ignore = "/bin/false"  # Always ignore auto-deploys from git pushes

# Manual deploys only - builds triggered by GitHub Actions
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Include RASM binary in function deployment
  included_files = ["functions/lib/rasm"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for functions
[context.production.environment]
  NODE_VERSION = "18"

[context.deploy-preview.environment]
  NODE_VERSION = "18"
