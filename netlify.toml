[build]
  command = """
    # Install Emscripten SDK in build directory (cached between builds)
    if [ ! -d "./emsdk" ]; then
      git clone --depth 1 https://github.com/emscripten-core/emsdk.git ./emsdk
      cd ./emsdk
      ./emsdk install latest
      ./emsdk activate latest
      cd ..
    fi
    # Activate Emscripten
    cd ./emsdk && . ./emsdk_env.sh && cd .. && \
    # Ensure pnpm via Corepack (strict versions)
    corepack enable && corepack prepare pnpm@10.11.0 --activate && \
    # Build RASM WASM
    chmod +x scripts/build-rasm-wasm.sh && \
    ./scripts/build-rasm-wasm.sh && \
    # Build the app
    pnpm build
  """
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.11.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
