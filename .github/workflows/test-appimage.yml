name: Test AppImage Build

on:
  push:
    branches:
      - fix-appimage-apprun
  pull_request:
    branches:
      - fix-appimage-apprun
  workflow_dispatch:

jobs:
  test-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse \
            libfuse2 \
            jq

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri binary with embedded frontend
        run: |
          cd src-tauri
          cargo build --release
          ls -lh target/release/pixsaur

      - name: Build .deb bundle
        run: |
          pnpm tauri build --bundles deb || true
          ls -lh src-tauri/target/release/bundle/deb/

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool

      - name: Create build script
        run: |
          chmod +x scripts/build-appimage.sh

      - name: Build AppImage from .deb
        run: |
          ./scripts/build-appimage.sh

      - name: List artifacts
        run: |
          echo "=== Build artifacts ==="
          ls -lh build/appimage/
          
      - name: Test AppImage
        run: |
          chmod +x build/appimage/*.AppImage
          build/appimage/*.AppImage --version || echo "AppImage created but version check failed (expected in CI)"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-appimage
          path: build/appimage/*.AppImage
          retention-days: 7
