name: Quality gate

# Fast blocking gate on every PR: typecheck (+ comprehensive), Biome & custom
# guards, Sheriff (report-only), react-doctor (blocks on NEW error-severity
# issues vs base — scripts/check-react-doctor.js), impeccable (report-only),
# jscpd (blocks over 3% duplication) and tests with coverage (ratchet floors in
# vitest.config.ts). Mutation testing (Stryker) is a deeper post-merge job — see
# mutation.yml. knip stays ratchet (refactor:preflight), not in this gate.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # react-doctor --scope changed diffs against the base branch.
          fetch-depth: 0

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install

      - name: Run quality gate
        run: pnpm gate
