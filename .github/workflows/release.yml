name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
      discussions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'  # macOS ARM64 (M1/M2/M3) - native build
            args: ''
          - platform: 'macos-13'  # macOS Intel (x86_64) - native build
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            jq

      - name: Install AppImage build dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y \
            librsvg2-dev \
            patchelf \
            fuse \
            libfuse2

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install jq

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install jq

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update version files
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          
          echo "Updating version to ${VERSION_NUM} in package.json and tauri.conf.json"
          
          # Update package.json
          jq ".version = \"${VERSION_NUM}\"" package.json > package.json.tmp && mv package.json.tmp package.json
          
          # Update tauri.conf.json
          jq ".version = \"${VERSION_NUM}\"" src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          
          # Export variables for subsequent steps
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_NUM=${VERSION_NUM}" >> $GITHUB_ENV

      - name: Commit version changes
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, continuing..."

      - name: Build info
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Args: ${{ matrix.args }}"
          rustc --version
          node --version
          pnpm --version

      - name: Build Tauri manually
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build ${{ matrix.args }}
        
      - name: List build artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Searching for macOS artifacts ==="
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) 2>/dev/null || true
          echo "=== Bundle directory contents ==="
          ls -laR src-tauri/target/release/bundle/ 2>/dev/null || true
          echo "=== All target subdirectories ==="
          ls -la src-tauri/target/ 2>/dev/null || true

      - name: List build artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Searching for Linux artifacts ==="
          find src-tauri/target -type f \( -name "*.deb" -o -name "*.AppImage*" -o -name "*.rpm" \) 2>/dev/null | head -10 || true

      - name: List build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo === Searching for MSI/EXE artifacts ===
          if exist src-tauri\target\release\bundle dir /s /b src-tauri\target\release\bundle\*.msi 2>nul
          if exist src-tauri\target\release\bundle dir /s /b src-tauri\target\release\bundle\*.exe 2>nul

      - name: Generate updater JSON
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          
          # Read signatures from .sig files (will be empty for first build, filled later)
          LINUX_SIG=""
          if [ -f "src-tauri/target/release/bundle/appimage/Pixsaur_${VERSION_NUM}_amd64.AppImage.sig" ]; then
            LINUX_SIG=$(cat "src-tauri/target/release/bundle/appimage/Pixsaur_${VERSION_NUM}_amd64.AppImage.sig")
          fi
          
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/${{ github.repository }}/releases/tag/${VERSION}",
            "pub_date": "${{ github.event.head_commit.timestamp }}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_x64-setup.exe"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_x64.dmg"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_aarch64.dmg"
              }
            }
          }
          EOF
          
          echo "Generated latest.json:"
          cat latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: matrix.platform == 'ubuntu-22.04'
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            src-tauri/target/release/bundle/rpm/*.rpm
            latest.json
