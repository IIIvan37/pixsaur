name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"

jobs:
  build-platforms:
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-14" # macOS ARM64 (M1/M2/M3) - native build
            args: ""
          - platform: "macos-13" # macOS Intel (x86_64) - native build
            args: ""
          - platform: "ubuntu-22.04"
            args: "--bundles appimage"
            bundle-type: "appimage"
          - platform: "ubuntu-22.04"
            args: "--bundles deb"
            bundle-type: "deb"
          - platform: "ubuntu-22.04"
            args: "--bundles rpm"
            bundle-type: "rpm"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        if: matrix.platform != 'ubuntu-22.04'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install jq

      - name: Install jq on Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install jq

      - name: Free disk space (appimage only)
        if: matrix.bundle-type == 'appimage'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            jq

      - name: Install AppImage build dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y \
            librsvg2-dev \
            patchelf \
            fuse \
            libfuse2

      - name: Pre-download AppImage tools (appimage only)
        if: matrix.bundle-type == 'appimage'
        run: |
          mkdir -p ~/.cache/tauri
          echo "Downloading linuxdeploy tools with retry..."
          for i in {1..5}; do
            curl -L -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage && break || sleep 10
          done
          for i in {1..5}; do
            curl -L -o ~/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage && break || sleep 10
          done
          chmod +x ~/.cache/tauri/*.AppImage
          echo "Downloads completed successfully"
          ls -lh ~/.cache/tauri/

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Set version variables
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          echo "Building version ${VERSION_NUM}"

          # Export variables for subsequent steps
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_NUM=${VERSION_NUM}" >> $GITHUB_ENV

      - name: Build info
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Args: ${{ matrix.args }}"
          rustc --version
          node --version
          pnpm --version

      - name: Build Tauri manually
        timeout-minutes: 45
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_INCREMENTAL: ${{ matrix.platform == 'ubuntu-22.04' && '0' || '1' }}
          CARGO_TARGET_DIR: ${{ matrix.bundle-type == 'appimage' && '/tmp/cargo-target' || 'target' }}
        run: |
          echo "=== Starting Tauri build at $(date -u +"%Y-%m-%d %H:%M:%S UTC") ==="
          echo "Platform: ${{ matrix.platform }}"
          
          # For AppImage: use /tmp for cargo target to have more space
          if [ "${{ matrix.bundle-type }}" = "appimage" ]; then
            echo "=== Disk space before build ==="
            df -h /tmp
            df -h .
            
            export LINUXDEPLOY="$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
            export LINUXDEPLOY_PLUGIN_APPIMAGE="$HOME/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage"
            echo "Using pre-downloaded linuxdeploy tools:"
            echo "  LINUXDEPLOY=$LINUXDEPLOY"
            echo "  LINUXDEPLOY_PLUGIN_APPIMAGE=$LINUXDEPLOY_PLUGIN_APPIMAGE"
            echo "  CARGO_TARGET_DIR=$CARGO_TARGET_DIR"
          fi
          
          pnpm tauri build ${{ matrix.args }}
          
          echo "=== Build completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC") ==="

      - name: Create updater archives (Linux)
        if: matrix.bundle-type == 'appimage'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./scripts/create-updater-archives.sh ${{ env.VERSION_NUM }} linux

      - name: Create updater archives (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: ./scripts/create-updater-archives.sh ${{ env.VERSION_NUM }} macos

      - name: Create updater archives (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: ./scripts/create-updater-archives.sh ${{ env.VERSION_NUM }} windows

      - name: List build artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Searching for macOS artifacts ==="
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) 2>/dev/null || true
          echo "=== Bundle directory contents ==="
          ls -laR src-tauri/target/release/bundle/ 2>/dev/null || true
          echo "=== All target subdirectories ==="
          ls -la src-tauri/target/ 2>/dev/null || true

      - name: List build artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Searching for Linux artifacts ==="
          find src-tauri/target -type f \( -name "*.deb" -o -name "*.AppImage*" -o -name "*.rpm" \) 2>/dev/null | head -10 || true

      - name: List build artifacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo === Searching for MSI/EXE artifacts ===
          if exist src-tauri\target\release\bundle dir /s /b src-tauri\target\release\bundle\*.msi 2>nul
          if exist src-tauri\target\release\bundle dir /s /b src-tauri\target\release\bundle\*.exe 2>nul

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: matrix.bundle-type == 'appimage'
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false

      - name: Upload macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

      - name: Upload Linux AppImage artifacts
        if: matrix.bundle-type == 'appimage'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

      - name: Upload Linux deb artifacts
        if: matrix.bundle-type == 'deb'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb

      - name: Upload Linux rpm artifacts
        if: matrix.bundle-type == 'rpm'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/rpm/*.rpm

  generate-updater-json:
    needs: build-platforms
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all signatures from release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          mkdir -p /tmp/sigs

          echo "Downloading signatures from release ${VERSION}..."

          # Download all signatures - they should all be available now since we used needs:
          gh release download ${VERSION} --pattern "Pixsaur_x64.app.tar.gz.sig" --dir /tmp/sigs --clobber
          gh release download ${VERSION} --pattern "Pixsaur_aarch64.app.tar.gz.sig" --dir /tmp/sigs --clobber
          gh release download ${VERSION} --pattern "Pixsaur_${VERSION_NUM}_x64-setup.exe.sig" --dir /tmp/sigs --clobber
          gh release download ${VERSION} --pattern "Pixsaur_${VERSION_NUM}_amd64.AppImage.tar.gz.sig" --dir /tmp/sigs --clobber

          echo ""
          echo "Downloaded files:"
          ls -la /tmp/sigs/

      - name: Generate updater JSON
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"

          # Read signatures from downloaded files
          LINUX_SIG=""
          WINDOWS_SIG=""
          DARWIN_X64_SIG=""
          DARWIN_AARCH64_SIG=""

          if [ -f "/tmp/sigs/Pixsaur_${VERSION_NUM}_amd64.AppImage.tar.gz.sig" ]; then
            LINUX_SIG=$(cat "/tmp/sigs/Pixsaur_${VERSION_NUM}_amd64.AppImage.tar.gz.sig")
          fi

          if [ -f "/tmp/sigs/Pixsaur_x64.app.tar.gz.sig" ]; then
            DARWIN_X64_SIG=$(cat "/tmp/sigs/Pixsaur_x64.app.tar.gz.sig")
          fi

          if [ -f "/tmp/sigs/Pixsaur_aarch64.app.tar.gz.sig" ]; then
            DARWIN_AARCH64_SIG=$(cat "/tmp/sigs/Pixsaur_aarch64.app.tar.gz.sig")
          fi

          if [ -f "/tmp/sigs/Pixsaur_${VERSION_NUM}_x64-setup.exe.sig" ]; then
            WINDOWS_SIG=$(cat "/tmp/sigs/Pixsaur_${VERSION_NUM}_x64-setup.exe.sig")
          fi

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/${{ github.repository }}/releases/tag/${VERSION}",
            "pub_date": "${{ github.event.head_commit.timestamp }}",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_${VERSION_NUM}_x64-setup.exe"
              },
              "darwin-x86_64": {
                "signature": "${DARWIN_X64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_x64.app.tar.gz"
              },
              "darwin-aarch64": {
                "signature": "${DARWIN_AARCH64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/${VERSION}/Pixsaur_aarch64.app.tar.gz"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Upload updater JSON to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: latest.json
