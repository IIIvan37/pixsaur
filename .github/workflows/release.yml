name: Release Desktop Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
      discussions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'  # macOS ARM64 (M1/M2/M3)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'  # macOS Intel (x86_64)
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build info
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Args: ${{ matrix.args }}"
          rustc --version
          node --version
          pnpm --version

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List and find artifacts
        run: |
          echo "=== Tree view of bundle directory ==="
          ls -R src-tauri/target/ | grep -E "bundle|\.dmg|\.app|\.msi|\.exe|\.deb|\.AppImage|\.rpm" || true
          echo ""
          echo "=== Finding specific artifacts ==="
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: matrix.platform == 'ubuntu-22.04'
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.msi.zip
            src-tauri/target/**/bundle/**/*.msi.zip.sig
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/bundle/**/*.AppImage.tar.gz.sig
            src-tauri/target/**/bundle/**/*.rpm
