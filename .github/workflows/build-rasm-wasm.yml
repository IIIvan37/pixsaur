name: Build RASM WebAssembly

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:latest
      options: --user root
    
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      
      - name: Verify Emscripten installation
        run: |
          emcc --version
          which emcc
      
      - name: Check if WASM files exist
        id: check_wasm
        run: |
          if [ -f "public/wasm/rasm.wasm" ] && [ -f "public/wasm/rasm.js" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "WASM files already exist, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "WASM files missing, will build"
          fi
      
      - name: Build RASM WebAssembly
        if: steps.check_wasm.outputs.exists == 'false'
        run: |
          chmod +x scripts/build-rasm-wasm.sh
          ./scripts/build-rasm-wasm.sh
      
      - name: Check generated files
        if: steps.check_wasm.outputs.exists == 'false'
        run: |
          ls -lh public/wasm/
          echo "WASM files generated successfully"
          du -h public/wasm/rasm.wasm
          du -h public/wasm/rasm.js
      
      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/pixsaur/pixsaur
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      
      - name: Commit WASM artifacts
        if: steps.check_wasm.outputs.exists == 'false'
        run: |
          # Force add files even if they're in .gitignore
          git add -f public/wasm/rasm.js public/wasm/rasm.wasm public/wasm/RASM-LICENSE.txt
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update RASM WebAssembly binaries [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rasm-wasm
          path: |
            public/wasm/rasm.js
            public/wasm/rasm.wasm
            public/wasm/RASM-LICENSE.txt
          retention-days: 90
