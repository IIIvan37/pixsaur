sonar.projectKey=IIIvan37_pixsaur
sonar.organization=iiivan37

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Pixsaur
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/test-*.js

# Coverage exclusions.
#
# gpu-processor.ts is excluded from COVERAGE ONLY (it is still analysed for
# bugs, smells and duplication). Every one of its statements runs against a live
# regl/WebGL context, which the headless CI does not have: a unit test can only
# reach it through a fake, and a fake regl asserts that the adapter forwards to
# itself — the exact test the 686-line regl-processor.spec.ts used to be before
# it was deleted. The CPU/GPU contract is pinned instead by
# processor-conformance.spec.ts (a describe.each both adapters satisfy, run for
# real against CpuProcessor), and the GPU path is verified by hand in the
# browser and the Tauri build. regl-quantizer.ts is deliberately NOT excluded:
# its four specs cover real logic.
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/test-*.js,**/*.d.ts,src/libs/pixsaur-adapter/adapters/gpu-processor.ts
