sonar.projectKey=IIIvan37_pixsaur
sonar.organization=iiivan37

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Pixsaur
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/test-*.js
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/test-*.js,**/*.d.ts
