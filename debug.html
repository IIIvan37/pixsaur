<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixsaur Debug Console</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            background: #1e1e1e;
            color: #f0f0f0;
            overflow: hidden;
        }
        #log-container {
            width: 100%;
            height: calc(100vh - 60px);
            overflow-y: auto;
            background: #000;
            border: 1px solid #333;
            padding: 10px;
            font-size: 12px;
            line-height: 1.4;
        }
        #controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #005aa3;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .log-entry {
            margin: 2px 0;
            white-space: pre-wrap;
        }
        .log-debug { color: #888; }
        .log-info { color: #fff; }
        .log-warn { color: #ffaa00; }
        .log-error { color: #ff4444; }
    </style>
</head>
<body>
    <div id="controls">
        <button id="clear-btn">Clear</button>
        <button id="test-updater-btn">Test Updater</button>
        <span id="status">Debug Console Ready</span>
    </div>
    <div id="log-container"></div>

    <script>
        const logContainer = document.getElementById('log-container');
        const clearBtn = document.getElementById('clear-btn');
        const testUpdaterBtn = document.getElementById('test-updater-btn');
        const statusSpan = document.getElementById('status');

        // Store logs in memory
        let logs = [];

        // Override console methods to capture logs
        const originalConsole = {
            log: console.log,
            info: console.info,
            warn: console.warn,
            error: console.error,
            debug: console.debug
        };

        function addLog(level, ...args) {
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg =>
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');

            const logEntry = {
                timestamp,
                level,
                message: `[${timestamp}] ${message}`
            };

            logs.push(logEntry);

            // Keep only last 1000 logs
            if (logs.length > 1000) {
                logs = logs.slice(-1000);
            }

            displayLogs();
        }

        function displayLogs() {
            logContainer.innerHTML = logs.map(log => {
                const cssClass = `log-${log.level}`;
                return `<div class="log-entry ${cssClass}">${log.message}</div>`;
            }).join('');
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Override console methods
        console.log = (...args) => {
            originalConsole.log(...args);
            addLog('info', ...args);
        };

        console.info = (...args) => {
            originalConsole.info(...args);
            addLog('info', ...args);
        };

        console.warn = (...args) => {
            originalConsole.warn(...args);
            addLog('warn', ...args);
        };

        console.error = (...args) => {
            originalConsole.error(...args);
            addLog('error', ...args);
        };

        console.debug = (...args) => {
            originalConsole.debug(...args);
            addLog('debug', ...args);
        };

        // UI event handlers
        clearBtn.addEventListener('click', () => {
            logs = [];
            displayLogs();
            addLog('info', 'Logs cleared');
        });

        testUpdaterBtn.addEventListener('click', async () => {
            statusSpan.textContent = 'Testing updater...';
            testUpdaterBtn.disabled = true;

            try {
                // Test updater check
                addLog('info', 'Testing updater functionality...');

                // This will be called from the main window
                if (window.__TAURI__) {
                    addLog('info', 'Tauri API available, testing updater...');
                    // The actual updater test will be done from the main window
                } else {
                    addLog('warn', 'Tauri API not available in debug window');
                }

                statusSpan.textContent = 'Test completed';
            } catch (error) {
                addLog('error', 'Updater test failed:', error);
                statusSpan.textContent = 'Test failed';
            } finally {
                testUpdaterBtn.disabled = false;
            }
        });

        // Initial log
        addLog('info', 'Pixsaur Debug Console initialized');
        addLog('info', 'Tauri available:', !!window.__TAURI__);

        // Listen for messages from main window
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'LOG_MESSAGE') {
                addLog(event.data.level || 'info', event.data.message);
            }
        });
    </script>
</body>
</html>
