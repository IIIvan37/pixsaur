<!DOCTYPE html>
<html>
<head>
    <title>Test WebGL Capabilities</title>
</head>
<body>
    <h1>WebGL Capabilities Test</h1>
    <div id="output"></div>
    
    <script type="module">
        import { detectWebGLCapabilities, isWebGLRecommended, getWebGLSummary } from '/src/libs/pixsaur-adapter/webgl-detection.ts'
        
        const capabilities = detectWebGLCapabilities()
        const recommended = isWebGLRecommended()
        const summary = getWebGLSummary()
        
        document.getElementById('output').innerHTML = `
            <h2>WebGL Detection Results:</h2>
            <p><strong>Available:</strong> ${capabilities.isAvailable}</p>
            <p><strong>Recommended:</strong> ${recommended}</p>
            <p><strong>Summary:</strong> ${summary}</p>
            <p><strong>Version:</strong> ${capabilities.version}</p>
            <p><strong>Performance:</strong> ${capabilities.performance}</p>
            <p><strong>Max Texture Size:</strong> ${capabilities.maxTextureSize}</p>
            <p><strong>Float Textures:</strong> ${capabilities.features.floatTextures}</p>
            <p><strong>Renderer:</strong> ${capabilities.renderer}</p>
            <p><strong>Vendor:</strong> ${capabilities.vendor}</p>
            
            <h3>Raw Capabilities Object:</h3>
            <pre>${JSON.stringify(capabilities, null, 2)}</pre>
        `
    </script>
</body>
</html>
